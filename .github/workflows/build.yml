name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановить зависимости
        run: dotnet restore
        working-directory: HelloDevOps

      - name: Собрать проект
        run: dotnet build --no-restore
        working-directory: HelloDevOps
